<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyros-AI — Thermal Source Monitor</title>

<!-- Leaflet and MarkerCluster are vendored, never CDN-loaded: the dashboard
     has to run by double-clicking this file with no network at all. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="ps">PS&nbsp;26162</span>
      <h1>Pyros-AI</h1>
      <span class="sub" id="region-sub">—</span>
    </div>
    <div id="stats">
      <div class="stat"><span class="k">Events</span><span class="v mono" id="s-events">—</span></div>
      <div class="stat"><span class="k">Detections</span><span class="v mono" id="s-dets">—</span></div>
      <div class="stat alert"><span class="k">Anomalies</span><span class="v mono" id="s-anom">—</span></div>
      <div class="stat verified"><span class="k">Verified</span><span class="v mono" id="s-verified">—</span></div>
      <div class="stat"><span class="k">Window</span><span class="v mono" id="s-window">—</span></div>
      <div id="basemap-status"><span class="led"></span><span id="basemap-text">Basemap</span></div>
    </div>
  </header>

  <div id="main">

    <aside id="sidebar">
      <div class="panel-head">
        <h2>Priority Queue</h2>
        <span class="count mono" id="queue-count">—</span>
      </div>
      <div id="filters"></div>
      <div id="queue"></div>
    </aside>

    <div id="map-wrap">
      <div id="map"></div>
      <div id="basemap-switch"></div>
      <div id="legend">
        <h3>Classification</h3>
        <div class="item"><span class="sw" style="background:#ef4444"></span>Industrial fire</div>
        <div class="item"><span class="sw" style="background:#3b82f6"></span>Gas flare</div>
        <div class="item"><span class="sw" style="background:#f97316"></span>Wildfire</div>
        <div class="item"><span class="sw" style="background:#eab308"></span>Agricultural burn</div>
        <div class="item"><span class="sw" style="background:#64748b"></span>Insufficient evidence</div>
        <div class="item"><span class="ring"></span>Baseline anomaly</div>
      </div>
    </div>

    <aside id="detail">
      <div class="panel-head">
        <h2>Event Detail</h2>
        <span class="count mono" id="detail-id"></span>
      </div>
      <div id="detail-body">
        <div id="placeholder">
          <div class="glyph">◎</div>
          <p>Select an event from the priority queue<br>or click a marker on the map.</p>
        </div>
      </div>
    </aside>

  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/markercluster.js"></script>
<!-- Payload as a script assignment rather than fetch(): browsers block fetch
     against file:// URLs, so a double-clicked page cannot read a local JSON
     file, but it can load a script. app.js falls back to fetch() and then to
     the API when those are available. -->
<script src="results.data.js"></script>
<script src="app.js"></script>
</body>
</html>
